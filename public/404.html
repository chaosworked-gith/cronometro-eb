<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cronômetro de Atividades | Elétrica Bahiana</title>
    <link rel="icon" type="image/png" href="/cronometro-eb/marca/logos/Icone_Azul.png" />
    <script>
      // O app usa endereços com # (ex.: /cronometro-eb/#/painel). Um endereço sem #
      // (ex.: /cronometro-eb/painel) cai aqui e é levado para a tela certa.
      var base = '/cronometro-eb/';
      var caminho = location.pathname;
      var resto = caminho.indexOf(base) === 0 ? caminho.slice(base.length).replace(/^\/+|\/+$/g, '') : '';
      location.replace(base + location.search + (resto ? '#/' + resto : location.hash));
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #001780;
        color: #ffffff;
        font-family: 'Lato', sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Abrindo o Cronômetro de Atividades...</p>
  </body>
</html>
